name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          mkdir -p SupportFiles
          xcodegen generate

      - name: Build (no code signing)
        run: |
          xcodebuild \
            -project MilsimProbe.xcodeproj \
            -scheme MilsimProbe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MilsimProbe.app Payload/
          zip -qry MilsimProbe-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MilsimProbe-unsigned-ipa
          path: MilsimProbe-unsigned.ipa
